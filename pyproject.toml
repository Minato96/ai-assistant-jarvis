[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Minato96", email = "charanteja1415@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mem0ai>=2.0.20",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "sentence-transformers>=6.0.1",
    # Only needed transitively (via sentence-transformers), but must be listed
    # directly for [tool.uv.sources] below to apply — uv only honors source
    # overrides for direct dependencies. Without this, uv resolves the default
    # CUDA build (pulls in several GB of nvidia-* packages) even on a machine
    # with no GPU use case for this embedder.
    "torch",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# Force CPU-only torch (see comment on the "torch" dependency above).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
